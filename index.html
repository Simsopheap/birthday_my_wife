<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600&family=Kantumruy+Pro:wght@400;600;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box
  }

  #w {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #1a0533 0%, #2d0b5a 40%, #1a1050 70%, #0d1a40 100%);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none
  }

  .stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 16px
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: tw var(--d) ease-in-out infinite var(--dl)
  }

  @keyframes tw {

    0%,
    100% {
      opacity: .1;
      transform: scale(1)
    }

    50% {
      opacity: .85;
      transform: scale(1.5)
    }
  }

  .ribbon {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #a855f7, #ec4899, #f59e0b, #10b981, #3b82f6, #a855f7);
    background-size: 300% 100%;
    animation: rs 3s linear infinite;
    border-radius: 16px 16px 0 0
  }

  @keyframes rs {
    0% {
      background-position: 0%
    }

    100% {
      background-position: 300%
    }
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    width: 100%;
    padding: 0 1rem
  }

  .hb {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.05rem, 2.8vw, 1.6rem);
    color: #FFD700;
    animation: bob 1.8s ease-in-out infinite
  }

  @keyframes bob {

    0%,
    100% {
      transform: translateY(0)
    }

    50% {
      transform: translateY(-4px)
    }
  }

  .name {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.5rem, 4.5vw, 2.4rem);
    color: #fff;
    animation: ng 2.5s ease-in-out infinite
  }

  @keyframes ng {

    0%,
    100% {
      text-shadow: 0 0 20px rgba(255, 180, 255, .6), 0 0 50px rgba(200, 100, 255, .3)
    }

    50% {
      text-shadow: 0 0 40px rgba(255, 180, 255, 1), 0 0 80px rgba(200, 100, 255, .7)
    }
  }

  .cake {
    animation: fc 3s ease-in-out infinite;
    width: 88px;
    height: 88px
  }

  @keyframes fc {

    0%,
    100% {
      transform: translateY(0) rotate(-1deg)
    }

    50% {
      transform: translateY(-7px) rotate(1deg)
    }
  }

  .date {
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 40px;
    padding: 4px 18px;
    color: rgba(255, 255, 255, .85);
    font-size: .72rem;
    letter-spacing: 2px
  }

  .wishes-row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 400px
  }

  .wish-pill {
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 40px;
    padding: 4px 12px;
    font-size: .7rem;
    color: rgba(255, 255, 255, .8);
    animation: pp .4s var(--pd) cubic-bezier(.4, 2, .4, 1) both
  }

  @keyframes pp {
    0% {
      transform: scale(0);
      opacity: 0
    }

    100% {
      transform: scale(1);
      opacity: 1
    }
  }

  .btn {
    margin-top: 12px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    border: none;
    border-radius: 40px;
    padding: 8px 28px;
    color: #fff;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(168, 85, 247, .5);
    transition: transform .2s, box-shadow .2s;
    font-family: 'Inter', sans-serif
  }

  .btn:hover {
    transform: scale(1.06) translateY(-2px);
    box-shadow: 0 8px 30px rgba(168, 85, 247, .7)
  }

  .btn:active {
    transform: scale(.97)
  }

  .btn:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none
  }

  .fwmsg {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Kantumruy Pro', sans-serif;
    font-size: .95rem;
    color: #FFD700;
    opacity: 0;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .5s;
    z-index: 20;
    font-size: clamp(.85rem, 2.5vw, 1.2rem);
    text-shadow: 0 0 20px rgba(255, 215, 0, .8)
  }

  .fwmsg.show {
    opacity: 1
  }

  .env {
    cursor: pointer;
    position: relative;
    width: 80px;
    height: 56px;
    transition: transform .3s
  }

  .env:hover {
    transform: scale(1.08)
  }

  .flap {
    transform-origin: top center;
    transition: transform .6s cubic-bezier(.4, 2, .6, 1)
  }

  .env.open .flap {
    transform: rotateX(180deg)
  }

  .msgbox {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 0, 30, .6);
    backdrop-filter: blur(1px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s
  }

  .msgbox.show {
    opacity: 1;
    pointer-events: all
  }

  .card {
    background: linear-gradient(145deg, #2d0b5a, #1a1050);
    border: 1px solid rgba(200, 130, 255, .35);
    border-radius: 20px;
    padding: 28px 32px 22px;
    max-width: 320px;
    width: 88%;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 40px rgba(168, 85, 247, .4);
    animation: popIn .45s cubic-bezier(.4, 1.6, .4, 1) both
  }

  @keyframes popIn {
    0% {
      transform: scale(.6);
      opacity: 0
    }

    100% {
      transform: scale(1);
      opacity: 1
    }
  }

  .card-icon {
    font-size: 2rem;
    display: block;
    margin-bottom: 10px;
    animation: bob 2s ease-in-out infinite
  }

  .wish-text {
    font-family: 'Kantumruy Pro', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    line-height: 1.9;
    color: #fff;
    animation: wishGlow 2.5s ease-in-out infinite;
    margin-bottom: 12px;
    letter-spacing: .5px
  }

  @keyframes wishGlow {

    0%,
    100% {
      text-shadow: 0 0 16px rgba(255, 180, 255, .5), 0 0 35px rgba(200, 100, 255, .3)
    }

    50% {
      text-shadow: 0 0 32px rgba(255, 180, 255, 1), 0 0 65px rgba(200, 100, 255, .7), 0 0 100px rgba(255, 100, 200, .3)
    }
  }

  .sub-text {
    font-family: 'Kantumruy Pro', sans-serif;
    font-weight: 400;
    font-size: .85rem;
    color: rgba(255, 220, 255, .7);
    margin-bottom: 18px;
    line-height: 1.9
  }

  .close-btn {
    font-family: 'Kantumruy Pro', sans-serif;
    font-weight: 600;
    font-size: .82rem;
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 30px;
    padding: 7px 24px;
    color: rgba(255, 255, 255, .85);
    cursor: pointer;
    transition: background .2s
  }

  .close-btn:hover {
    background: rgba(255, 255, 255, .22)
  }

  .spark-word {
    display: inline-block;
    animation: sparkWord 1.5s ease-in-out infinite var(--sw)
  }

  @keyframes sparkWord {

    0%,
    100% {
      transform: translateY(0) scale(1)
    }

    50% {
      transform: translateY(-5px) scale(1.07)
    }
  }

  .ce {
    position: absolute;
    font-size: 1.2rem;
    pointer-events: none;
    animation: cf linear forwards;
    z-index: 15;
    user-select: none
  }

  @keyframes cf {
    0% {
      transform: translateY(-30px) rotate(0);
      opacity: 1
    }

    100% {
      transform: translateY(580px) rotate(720deg);
      opacity: 0
    }
  }
</style>

<div id="w">
  <div class="ribbon"></div>
  <div class="stars" id="stars"></div>
  <canvas id="c"></canvas>
  <div class="fwmsg" id="fm">✨ រីករាយថ្ងៃកំណើតអូនសម្លាញ់! ✨</div>

  <div class="msgbox" id="msgbox">
    <div class="card">
      <span class="card-icon">💌</span>
      <div class="wish-text">
        <span class="spark-word" style="--sw:0s">រីករាយ</span>
        <span class="spark-word" style="--sw:.15s">ថ្ងៃ</span>
        <span class="spark-word" style="--sw:.3s">កំណើត</span><br>
        <span class="spark-word" style="--sw:.45s">ប្រពន្ធ</span>
        <span class="spark-word" style="--sw:.6s">សម្លាញ់</span>
      </div>
      <div class="sub-text">សូមឱ្យអូនសុខភាពល្អ<br>ជីវិតពេញដោយសុភមង្គល លុយហូរចូលច្រើនៗ 💜</div>
      <button class="close-btn" onclick="closeMsg()">✕ បិទ</button>
    </div>
  </div>

  <div class="content">
    <div class="hb">🎉 Happy Birthday! 🎉</div>
    <svg class="cake" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="88" rx="38" ry="7" fill="rgba(0,0,0,.2)" />
      <rect x="12" y="62" width="76" height="28" rx="7" fill="#f472b6" />
      <rect x="12" y="62" width="76" height="10" rx="4" fill="#fbcfe8" />
      <rect x="16" y="40" width="68" height="26" rx="7" fill="#a855f7" />
      <rect x="16" y="40" width="68" height="9" rx="4" fill="#d8b4fe" />
      <rect x="20" y="22" width="60" height="22" rx="7" fill="#ec4899" />
      <rect x="20" y="22" width="60" height="8" rx="4" fill="#fce7f3" />
      <rect x="30" y="70" width="8" height="5" rx="2" fill="#fff" />
      <rect x="46" y="70" width="8" height="5" rx="2" fill="#fff" />
      <rect x="62" y="70" width="8" height="5" rx="2" fill="#fff" />
      <rect x="32" y="12" width="5" height="12" rx="2.5" fill="#fde68a" />
      <rect x="48" y="12" width="5" height="12" rx="2.5" fill="#fde68a" />
      <rect x="64" y="12" width="5" height="12" rx="2.5" fill="#fde68a" />
      <ellipse id="f1" cx="34.5" cy="10" rx="3" ry="5" fill="#FFD700" opacity=".95" />
      <ellipse id="f2" cx="50.5" cy="10" rx="3" ry="5" fill="#f97316" opacity=".95" />
      <ellipse id="f3" cx="66.5" cy="10" rx="3" ry="5" fill="#ef4444" opacity=".95" />
    </svg>
    <div class="name">Yen Dane</div>
    <div class="date">04 · 06 · 2026</div>
    <div class="wishes-row">
      <div class="wish-pill" style="--pd:.15s">🌟 Joy & Happiness</div>
      <div class="wish-pill" style="--pd:.28s">💜 Love & Health</div>
      <div class="wish-pill" style="--pd:.41s">🚀 Success Always</div>
      <div class="wish-pill" style="--pd:.54s">✨ Dreams Come True</div>
    </div>
    <div class="env" id="env" onclick="toggleEnv()">
      <svg viewBox="0 0 80 56" width="80" height="56" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="14" width="78" height="40" rx="5" fill="#7c3aed" stroke="#a855f7" stroke-width="1.2" />
        <polygon class="flap" points="1,14 40,38 79,14" fill="#9333ea" stroke="#a855f7" stroke-width=".8" />
        <polyline points="1,54 32,34" stroke="#c084fc" stroke-width="1" fill="none" />
        <polyline points="79,54 48,34" stroke="#c084fc" stroke-width="1" fill="none" />
      </svg>
    </div>
    <button class="btn" id="celebBtn" onclick="celebrate()">🎊 Celebrate!</button>
  </div>
</div>

<script>
  const wrap = document.getElementById('w'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let parts = [], W, H, frame = 0;
  const COLS = ['#a855f7', '#ec4899', '#FFD700', '#10b981', '#3b82f6', '#f97316', '#fff', '#c084fc', '#f472b6'];
  function resize() { W = cv.width = wrap.offsetWidth; H = cv.height = wrap.offsetHeight }
  resize(); window.addEventListener('resize', resize);
  function rnd(a, b) { return a + Math.random() * (b - a) }
  function spark(x, y, n = 1) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = rnd(1.5, 6); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rnd(0, 2), r: rnd(2, 5), c: COLS[~~(Math.random() * COLS.length)], life: 1, decay: rnd(.013, .032), star: Math.random() > .6, rot: Math.random() * Math.PI * 2, rs: rnd(-.15, .15) }) } }
  function drawStar(x, y, r, rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = (i * 4 * Math.PI) / 5 - Math.PI / 2; i ? ctx.lineTo(r * Math.cos(a), r * Math.sin(a)) : ctx.moveTo(r * Math.cos(a), r * Math.sin(a)) } ctx.closePath(); ctx.fill(); ctx.restore() }
  function loop() { requestAnimationFrame(loop); ctx.clearRect(0, 0, W, H); frame++; if (frame % 20 === 0) spark(rnd(W * .1, W * .9), rnd(H * .05, H * .55), 2); parts = parts.filter(p => p.life > 0); for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= p.decay; p.rot += p.rs; ctx.globalAlpha = p.life; ctx.fillStyle = p.c; p.star ? drawStar(p.x, p.y, p.r, p.rot) : (ctx.beginPath(), ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2), ctx.fill()) } ctx.globalAlpha = 1 }
  loop();

  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 55; i++) { const s = document.createElement('div'); s.className = 'star'; const sz = Math.random() * 2.5 + .5; s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;--d:${2 + Math.random() * 4}s;--dl:-${Math.random() * 4}s`; starsEl.appendChild(s) }

  let envOpen = false;

  function toggleEnv() {
    envOpen = !envOpen;
    document.getElementById('env').classList.toggle('open', envOpen);
    if (envOpen) {
      const r = document.getElementById('env').getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      spark(r.left - wr.left + r.width / 2, r.top - wr.top + r.height / 2, 20);
      setTimeout(() => openMsg(), 400);
    }
  }

  function openMsg() {
    document.getElementById('msgbox').classList.add('show');
    for (let i = 0; i < 8; i++)setTimeout(() => spark(rnd(W * .1, W * .9), rnd(H * .1, H * .6), 15), i * 120);
    dropConfetti();
  }

  function closeMsg() {
    document.getElementById('msgbox').classList.remove('show');
    envOpen = false;
    document.getElementById('env').classList.remove('open');
  }

  document.getElementById('msgbox').addEventListener('click', function (e) {
    if (e.target === this) closeMsg();
  });

  function dropConfetti() {
    const em = ['🎊', '🎉', '⭐', '💜', '🌟', '💫', '🎂', '✨', '🥳', '💐'];
    for (let i = 0; i < 18; i++)setTimeout(() => { const el = document.createElement('div'); el.className = 'ce'; el.textContent = em[~~(Math.random() * em.length)]; el.style.left = rnd(2, 95) + '%'; el.style.animationDuration = rnd(2.5, 4.5) + 's'; el.style.animationDelay = rnd(0, .3) + 's'; wrap.appendChild(el); el.addEventListener('animationend', () => el.remove()) }, i * 90)
  }

  const CELEBRATE_DURATION = 3500; // ms for fireworks before dialog shows

  function celebrate() {
    const btn = document.getElementById('celebBtn');
    btn.disabled = true;

    const fm = document.getElementById('fm');
    fm.classList.add('show');
    setTimeout(() => fm.classList.remove('show'), 2400);

    // fireworks + confetti burst — NO dialog yet
    for (let i = 0; i < 14; i++)setTimeout(() => spark(rnd(W * .05, W * .95), rnd(H * .05, H * .7), 22), i * 120);
    dropConfetti();

    // flame animation
    let t = 0; const iv = setInterval(() => { t++; const sc = 1 + .28 * Math.sin(t * .5);['f1', 'f2', 'f3'].forEach(id => { const el = document.getElementById(id); if (el) el.setAttribute('ry', String(5 * sc)) }); if (t > 60) clearInterval(iv) }, 50);

    // after celebration finishes → open envelope + show dialog
    setTimeout(() => {
      if (!envOpen) {
        envOpen = true;
        document.getElementById('env').classList.add('open');
        const r = document.getElementById('env').getBoundingClientRect(), wr = wrap.getBoundingClientRect();
        spark(r.left - wr.left + r.width / 2, r.top - wr.top + r.height / 2, 20);
      }
      setTimeout(() => {
        openMsg();
        btn.disabled = false;
      }, 450);
    }, CELEBRATE_DURATION);
  }

  wrap.addEventListener('mousemove', e => { if (Math.random() < .12) { const r = wrap.getBoundingClientRect(); spark(e.clientX - r.left, e.clientY - r.top, 2) } });
  wrap.addEventListener('click', e => { if (e.target.closest('.btn') || e.target.closest('.env') || e.target.closest('.msgbox')) return; const r = wrap.getBoundingClientRect(); spark(e.clientX - r.left, e.clientY - r.top, 10) });

  // auto open envelope on load
  setTimeout(() => { if (!envOpen) toggleEnv() }, 800);
</script>
